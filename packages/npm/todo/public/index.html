<!doctype html>

<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>To-Do Sample</title>
    <script src="/client.js"></script>
    <style>
      * {
        font-size: inherit;
        color: inherit;
        font-family: inherit;
        box-sizing: border-box;
      }
      body {
        font-size: 16px;
        font-family: Arial, sans-serif;
        display: flex;
        flex-direction: column;
        align-items: center;
        margin: 0;
        padding: 0;
      }
      h1 {
        font-size: 2rem;
        color: #333;
        margin-top: 2rem;
      }
      form {
        display: flex;
        align-items: center;
        margin-top: 1rem;
        gap: 0.5rem;
        max-width: 500px;
        width: 100%;
      }
      form > input {
        flex-grow: 1;
        padding: 0.75rem;
        font-size: 1rem;
      }
      form > button {
        padding: 0.75rem 1.5rem;
        font-size: 1rem;
        border: none;
        border-radius: 8px;
        cursor: pointer;
      }

      #todoItems > div > button {
        padding: 0.375rem 0.75rem;
        margin: 0.375rem 0.75rem;
        font-size: 1rem;
        border: none;
        border-radius: 8px;
        cursor: pointer;
      }
      /* Responsive adjustments */

      @media (max-width: 600px) {
        body {
          padding: 1rem;
        }
        form {
          flex-direction: column;
          gap: 0.5rem;
        }
        form > button {
          width: 100%;
        }
      }
      /* Style for each to-do item container */
      .todo-item {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 0.75rem;
        border-bottom: 1px solid #ccc;
        max-width: 500px;
        width: 100%;
      }

      /* Button styles */
      #todoItems > div > button {
        padding: 0.375rem 0.75rem;
        margin: 0 0.25rem;
        font-size: 1rem;
        border: none;
        border-radius: 8px;
        cursor: pointer;
      }

      /* Mark as Done button */
      .mark-done {
        background-color: #4caf50;
        color: #fff;
      }

      .mark-done:hover {
        background-color: #45a049;
      }

      /* Update button */
      .update {
        background-color: #ffa500;
        color: #fff;
      }

      .update:hover {
        background-color: #ff8c00;
      }

      /* Delete button */
      .delete {
        background-color: #f44336;
        color: #fff;
      }

      .delete:hover {
        background-color: #e53935;
      }

      /* Completed item styling */
      .done {
        text-decoration: line-through;
        color: #999;
      }
    </style>
  </head>
  <body>
    <h1>To-Do Sample</h1>
    <form>
      <input type="text" placeholder="Enter your to-do item..." />
      <button type="submit">Add To-Do</button>
    </form>
    <div id="todoItems"></div>
  </body>
</html>
